# Workspace for the Nest app SDK and this app.
#
# Kept out of the device app's own build: everything here targets the
# Nest's `armv7-unknown-linux-musleabihf` and nothing here is linked
# into the Nest app itself.
[workspace]
resolver = "3"
members = ["sdk", "stm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
nest-app-sdk = { path = "sdk" }
serde_json = "1.0"

# Same release posture as `nest-app/Cargo.toml`: one small static binary is
# what the app package carries, and the manifest caps it at 4 MB.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
